<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MmxCode 用量监控</title>
<script src="/echarts.min.js"></script>
<style>
:root,
:root[data-theme="dark"]{
  --mcode-bg:#171717;--mcode-bg-secondary:#1c1c1c;--mcode-surface:#262626;
  --mcode-surface-muted:#262626;--mcode-text:#ededed;--mcode-text-muted:#949494;
  --mcode-text-subtle:#666666;--mcode-border:#ffffff14;--mcode-border-strong:#fffffff2;
  --mcode-accent:#0077d9;--mcode-success:#009c3d;--mcode-warning:#e25507;
  --mcode-danger:#e31937;--mcode-primary-action-bg:#ffffff;--mcode-primary-action-text:#171717;
  --mcode-chart-1:#5cb2f2;--mcode-chart-2:#e0a34e;--mcode-chart-3:#3fc06d;
  --mcode-chart-4:#b493f0;--mcode-chart-5:#45c8d4;--mcode-chart-6:#f07178;
}
:root[data-theme="light"]{
  --mcode-bg:#ffffff;--mcode-bg-secondary:#f5f5f5;--mcode-surface:#ffffff;
  --mcode-surface-muted:#fafafa;--mcode-text:#171717;--mcode-text-muted:#666666;
  --mcode-text-subtle:#adadad;--mcode-border:#0a0a0a14;--mcode-border-strong:#0a0a0af2;
  --mcode-accent:#0094fc;--mcode-success:#04b54b;--mcode-warning:#f56811;
  --mcode-danger:#f73646;--mcode-primary-action-bg:#171717;--mcode-primary-action-text:#ffffff;
  --mcode-chart-1:#0969da;--mcode-chart-2:#9a6700;--mcode-chart-3:#1a7f37;
  --mcode-chart-4:#8250df;--mcode-chart-5:#1b7c83;--mcode-chart-6:#cf222e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--mcode-bg);color:var(--mcode-text);
  font:14px/1.55 ui-sans-serif,-apple-system,system-ui,"Segoe UI","Microsoft YaHei",
    Roboto,Helvetica,Arial,sans-serif;
  max-width:1240px;margin:0 auto;
  padding:clamp(12px,2vw,20px) clamp(14px,3vw,24px) 40px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:18px;font-weight:600}
h1 .dot{display:inline-block;width:9px;height:9px;border-radius:50%;
  background:var(--mcode-success);margin-right:8px}
.sub{color:var(--mcode-text-muted);font-size:12px}
.spacer{flex:1}
select,button{background:var(--mcode-bg-secondary);color:var(--mcode-text);
  border:1px solid var(--mcode-border);border-radius:8px;padding:4px 10px;
  font-size:13px;cursor:pointer;font-family:inherit;height:30px}
select:hover,button:hover{border-color:var(--mcode-accent)}
select:focus-visible,button:focus-visible{outline:2px solid var(--mcode-accent);
  outline-offset:1px}
.err{color:var(--mcode-danger);padding:20px;font-size:15px}

/* --- 多选下拉 --- */
.dd{position:relative}
.ddbtn{display:flex;align-items:center;gap:7px;min-width:150px;justify-content:space-between}
.ddbtn .cnt{color:var(--mcode-accent);font-weight:600}
.ddbtn .caret{color:var(--mcode-text-muted);display:inline-flex}
.ddpanel{position:absolute;top:calc(100% + 6px);right:0;z-index:50;
  width:min(300px,calc(100vw - 40px));
  background:var(--mcode-surface);border:1px solid var(--mcode-border);
  border-radius:12px;padding:10px;
  box-shadow:0 0 20px rgb(10 10 10 / 8%);display:none}
.ddpanel.open{display:block}
.ddhead{display:flex;gap:12px;padding:0 4px 8px;border-bottom:1px solid var(--mcode-border);
  margin-bottom:6px}
.ddhead a{color:var(--mcode-accent);font-size:12px;cursor:pointer;text-decoration:none}
.ddhead a:hover{text-decoration:underline}
.ddlist{max-height:280px;overflow:auto}
.ddrow{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:8px;
  cursor:pointer;font-size:13px}
.ddrow:hover{background:var(--mcode-bg-secondary)}
.ddrow input{accent-color:var(--mcode-accent);cursor:pointer;width:14px;height:14px}
.ddrow .mname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddrow .mmeta{color:var(--mcode-text-muted);font-size:11px;font-variant-numeric:tabular-nums}
.swatch{width:9px;height:9px;border-radius:2px;flex:none}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-bottom:16px}
.kpi{background:var(--mcode-surface);border:1px solid var(--mcode-border);
  border-radius:12px;padding:12px 14px}
.kpi .label{color:var(--mcode-text-muted);font-size:12px;margin-bottom:4px}
.kpi .value{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .hint{color:var(--mcode-text-muted);font-size:11px;margin-top:2px}
section.panel{background:var(--mcode-surface);border:1px solid var(--mcode-border);
  border-radius:12px;padding:14px 16px;margin-bottom:16px}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.panel h2{font-size:15px;font-weight:500;color:var(--mcode-text)}
.toggle{display:flex;border:1px solid var(--mcode-border);border-radius:8px;overflow:hidden}
.toggle button{border:0;border-radius:0;background:transparent;padding:3px 10px;
  font-size:12px;height:auto}
.toggle button.on{background:var(--mcode-accent);color:var(--mcode-bg);font-weight:600}
.chart{width:100%}
#mainChart{height:340px}
#modelChart{height:260px}
.empty{padding:40px;text-align:center;color:var(--mcode-text-muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;
  font-variant-numeric:tabular-nums}
th{color:var(--mcode-text-muted);font-weight:500;text-align:right;padding:6px 10px;
  border-bottom:1px solid var(--mcode-border);position:sticky;top:0;
  background:var(--mcode-surface)}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:5px 10px;border-bottom:1px solid var(--mcode-border);
  color:var(--mcode-text)}
tr:hover td{background:var(--mcode-bg-secondary)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;
  border:1px solid var(--mcode-border);white-space:nowrap}
.tablewrap{max-height:420px;overflow:auto}
footer{color:var(--mcode-text-muted);font-size:12px;text-align:center;margin-top:8px}
#toast{position:fixed;top:14px;right:14px;background:var(--mcode-bg-secondary);
  border:1px solid var(--mcode-danger);color:var(--mcode-danger);border-radius:8px;
  padding:8px 14px;font-size:13px;display:none;max-width:420px;z-index:99}

/* ---------- 响应式 ---------- */
@media (max-width:720px){
  h1{font-size:16px}
  header{gap:8px}
  .kpis{gap:8px;grid-template-columns:repeat(auto-fit,minmax(125px,1fr))}
  .kpi{padding:10px 12px}
  .kpi .value{font-size:18px}
  .panel{padding:10px 12px;border-radius:12px}
  #mainChart{height:260px}
  #modelChart{height:220px}
  .tablewrap{max-height:360px}
  table{min-width:620px}
  select,button{font-size:12px;padding:4px 8px}
  #toast{left:14px;max-width:none}
}
</style>
</head>
<body>
<div id="app">
<header>
  <h1><span class="dot" aria-hidden="true"></span>MmxCode 用量监控</h1>
  <span class="sub" id="dbinfo"></span>
  <div class="spacer"></div>

  <div class="dd" id="modelDd">
    <button class="ddbtn" id="ddBtn" aria-haspopup="true" aria-expanded="false">
      <span id="ddLabel">模型: 全部</span>
      <span class="caret" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M1.5 3.5 L5 7 L8.5 3.5" stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </button>
    <div class="ddpanel" id="ddPanel" role="menu">
      <div class="ddhead">
        <a id="ddAll" role="button" tabindex="0">全选</a>
        <a id="ddInvert" role="button" tabindex="0">反选</a>
      </div>
      <div class="ddlist" id="ddList"></div>
    </div>
  </div>

  <label class="sub" for="range" style="position:absolute;left:-9999px">时间范围</label>
  <select id="range">
    <option value="1h">最近 1 小时</option>
    <option value="24h">最近 24 小时</option>
    <option value="7d">最近 7 天</option>
    <option value="30d">最近 30 天</option>
    <option value="all" selected>全部</option>
  </select>
  <label class="sub" for="interval" style="position:absolute;left:-9999px">刷新间隔</label>
  <select id="interval">
    <option value="0">手动刷新</option>
    <option value="5">自动 5s</option>
    <option value="10" selected>自动 10s</option>
    <option value="30">自动 30s</option>
  </select>
  <button id="refresh" aria-label="立即刷新数据">刷新</button>
  <button id="themeBtn" title="主题: 跟随系统（点击切换）">主题: 自动</button>
</header>

<div id="toast" role="alert"></div>
<div class="kpis" id="kpis"></div>
<div class="empty" id="bootStatus" role="status">正在读取本地用量数据…</div>

<section class="panel" aria-label="Token 消耗时序">
  <div class="phead">
    <h2>Token 消耗时序</h2>
    <span class="sub" id="bucketInfo"></span>
    <div class="spacer"></div>
    <div class="toggle" id="viewToggle" role="tablist">
      <button data-view="agg" class="on" role="tab" aria-selected="true">聚合</button>
      <button data-view="split" role="tab" aria-selected="false">按模型拆分</button>
    </div>
  </div>
  <div id="mainChart" class="chart"></div>
  <div class="empty" id="mainEmpty" style="display:none">当前筛选条件下没有数据</div>
</section>

<section class="panel" aria-label="模型对比">
  <div class="phead"><h2>模型对比</h2>
    <span class="sub">点击柱子可只看该模型，再次点击取消</span></div>
  <div id="modelChart" class="chart"></div>
</section>

<section class="panel" aria-label="最近调用">
  <div class="phead"><h2>最近调用</h2><span class="sub" id="recentInfo"></span></div>
  <div class="tablewrap">
  <table>
    <thead><tr>
      <th scope="col">时间</th><th scope="col">模型</th><th scope="col">会话</th>
      <th scope="col">输入</th><th scope="col">输出</th><th scope="col">缓存读取</th>
      <th scope="col">耗时</th><th scope="col">速度 tok/s</th>
    </tr></thead>
    <tbody id="recentBody"></tbody>
  </table>
  </div>
</section>

<footer id="foot"></footer>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>n==null?'—':n.toLocaleString('zh-CN');
const fmtTok=n=>{
  if(n==null)return '—';
  if(n>=1e6)return (n/1e6).toFixed(n>=1e7?1:2)+'M';
  if(n>=1e3)return (n/1e3).toFixed(1)+'K';
  return String(n);
};
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const palette=()=>['--mcode-chart-1','--mcode-chart-2','--mcode-chart-3',
  '--mcode-chart-4','--mcode-chart-5','--mcode-chart-6'].map(cssVar);
const colorOf=i=>palette()[i%6];
const isNarrow=()=>window.innerWidth<680;

/* ---------- 主题: 跟随系统配色; 按钮可临时切换, 不持久化 ---------- */
const THEME={
  dark:{axis:'#ffffff2e',label:'#94949e'.replace('9e','9f'),split:'#ffffff12',
        tipBg:'#262626',tipBorder:'#ffffff14',tipText:'#ededed'},
  light:{axis:'#0a0a0a24',label:'#666666',split:'#0a0a0a0f',
         tipBg:'#ffffff',tipBorder:'#0a0a0a24',tipText:'#171717'},
};
const T=()=>THEME[document.documentElement.dataset.theme==='light'?'light':'dark'];
let themeMode='auto'; // auto | light | dark
const mqLight=window.matchMedia('(prefers-color-scheme: light)');
const THEME_NAME={auto:'自动',light:'亮色',dark:'暗色'};
function applyTheme(){
  const effective=themeMode==='auto'?(mqLight.matches?'light':'dark'):themeMode;
  document.documentElement.dataset.theme=effective;
  $('themeBtn').textContent='主题: '+THEME_NAME[themeMode];
  $('themeBtn').title='主题: '+THEME_NAME[themeMode]+'（点击切换）';
  if(lastData&&window.echarts){renderMain(lastData);renderModels(lastData.models);}
}
$('themeBtn').onclick=()=>{
  themeMode=themeMode==='auto'?'light':(themeMode==='light'?'dark':'auto');
  applyTheme();
};
mqLight.addEventListener('change',()=>{if(themeMode==='auto')applyTheme();});

/* 模型筛选状态: null = 全部；不做持久化，每次打开都从全部模型开始 */
let sel=null;

let splitMode=false;
let mainChart=null,modelChart=null,timer=null,lastData=null;

function toast(msg,ok){
  const t=$('toast');
  t.textContent=msg;t.style.borderColor=ok?'var(--mcode-success)':'var(--mcode-danger)';
  t.style.color=ok?'var(--mcode-success)':'var(--mcode-danger)';t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4500);
}

function modelTag(m){
  return `<span class="tag">${m}</span>`;
}

/* ---------- 多选下拉 ---------- */
function renderDd(avail){
  const list=$('ddList');
  const order=(avail||[]).map(m=>m.model);

  list.innerHTML=(avail||[]).map((m,i)=>`
    <label class="ddrow">
      <input type="checkbox" data-model="${m.model}" ${(!sel||sel.includes(m.model))?'checked':''}>
      <span class="swatch" style="background:${colorOf(i)}"></span>
      <span class="mname">${m.model}</span>
      <span class="mmeta">${fmt(m.calls)} 次 · ${fmtTok(m.output)} out</span>
    </label>`).join('') || '<div class="sub" style="padding:8px">当前范围无模型数据</div>';

  list.querySelectorAll('input[data-model]').forEach(cb=>{
    cb.onchange=()=>{
      const all=order.slice();
      const picked=[...list.querySelectorAll('input[data-model]')]
        .filter(x=>x.checked).map(x=>x.dataset.model);
      sel=(picked.length===all.length)?null:(picked.length?picked:[]);
      if(sel&&sel.length===0){ // 全不选 -> 视为全部，避免空图
        sel=null;
        list.querySelectorAll('input[data-model]').forEach(x=>x.checked=true);
      }
      updateDdLabel();load();
    };
  });
  updateDdLabel();
}

function updateDdLabel(){
  const n=sel?sel.length:null;
  if(!sel)$('ddLabel').innerHTML='模型: <span class="cnt">全部</span>';
  else if(n===1)$('ddLabel').innerHTML=`模型: <span class="cnt">${sel[0]}</span>`;
  else $('ddLabel').innerHTML=`已选 <span class="cnt">${n}</span> 个模型`;
}

function ddSet(mode){
  if(!lastData)return;
  const all=lastData.available_models.map(m=>m.model);
  if(mode==='all')sel=null;
  else if(mode==='invert'){
    const cur=sel||all;
    const inv=all.filter(m=>!cur.includes(m));
    sel=inv.length?inv:null;
  }
  renderDd(lastData.available_models);
  load();
}

$('ddBtn').onclick=e=>{
  e.stopPropagation();
  const open=$('ddPanel').classList.toggle('open');
  $('ddBtn').setAttribute('aria-expanded',open?'true':'false');
};
$('ddPanel').onclick=e=>e.stopPropagation();
document.addEventListener('click',()=>{
  $('ddPanel').classList.remove('open');
  $('ddBtn').setAttribute('aria-expanded','false');
});
$('ddAll').onclick=()=>ddSet('all');
$('ddInvert').onclick=()=>ddSet('invert');

/* ---------- 视图切换 ---------- */
$('viewToggle').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  splitMode=b.dataset.view==='split';
  [...$('viewToggle').children].forEach(x=>{
    const on=x===b;
    x.classList.toggle('on',on);
    x.setAttribute('aria-selected',on?'true':'false');
  });
  if(lastData)renderMain(lastData);
};

/* ---------- 数据 ---------- */
function apiUrl(){
  let u='/api/data?range='+$('range').value;
  if(sel&&sel.length)u+='&models='+encodeURIComponent(sel.join(','));
  return u;
}

async function load(){
  try{
    const r=await fetch(apiUrl());
    const d=await r.json();
    if(d.error){toast('读取失败: '+d.error);return}
    lastData=d;
    // 选中项若已不在可用列表，自动收敛
    if(sel){
      const avail=new Set(d.available_models.map(m=>m.model));
      const kept=sel.filter(m=>avail.has(m));
      if(kept.length!==sel.length)sel=kept.length?kept:null;
    }
    render(d);
    const l=d.ledger;
    const dup=d.dedup_dropped?` · 跨会话去重 ${d.dedup_dropped} 行`:'';
    $('foot').textContent=`快照 ${d.generated_at} · 账本表 ${l?fmt(l.rows)+' 条':''}${dup} · 只读快照，不影响运行中的 MiniMax Code`;
  }catch(e){toast('请求失败: '+e.message)}
}

function render(d){
  $('bootStatus').style.display='none';
  renderDd(d.available_models);
  const o=d.overview;
  const scope=sel?(sel.length===1?sel[0]:sel.length+' 个模型'):'全部模型';
  $('bucketInfo').textContent=o.calls
    ? `（${scope} · ${fmt(o.calls)} 次调用 · 命中 ${o.hit_rate_pct}% · 加权输出 ${o.avg_tok_s} tok/s）`
    : `（${scope}）`;
  $('recentInfo').textContent=o.calls?`筛选后 ${fmt(o.calls)} 次调用中的最近 ${d.recent.length} 条`:'';

  const cards=[
    ['Token 消耗',fmtTok(o.total_tokens),
     `输入 ${fmtTok(o.input_tokens)} · 缓存 ${fmtTok(o.cache_read_tokens)} · 输出 ${fmtTok(o.output_tokens)}`],
    ['输入 tokens',fmtTok(o.input_tokens),'新计入 prompt 的部分'],
    ['输出 tokens',fmtTok(o.output_tokens),`累计生成 ${o.sum_dur_s}s`],
    ['缓存读取',fmtTok(o.cache_read_tokens),'服务端命中的缓存'],
    ['缓存命中率',o.hit_rate_pct+'%','cache_read / (cache_read+input)'],
    ['调用次数',fmt(o.calls),scope],
    ['输出速度',o.avg_tok_s+' tok/s','Σoutput / Σduration 加权'],
  ];
  $('kpis').innerHTML=cards.map(c=>
    `<div class="kpi"><div class="label">${c[0]}</div>
     <div class="value">${c[1]}</div><div class="hint">${c[2]}</div></div>`).join('');

  renderMain(d);
  renderModels(d.models);
  renderRecent(d.recent);
}

function renderMain(d){
  const empty=!d.overview.calls;
  $('mainEmpty').style.display=empty?'block':'none';
  $('mainChart').style.display=empty?'none':'block';
  if(empty||!window.echarts)return;
  if(!mainChart)mainChart=echarts.init($('mainChart'));
  const s=d.series;
  const C={cache:cssVar('--mcode-chart-1'),input:cssVar('--mcode-chart-2'),
           output:cssVar('--mcode-chart-3')};

  if(splitMode&&d.split.models.length){
    // 按模型拆分: 每个模型一条输出曲线
    const nameIdx={};
    d.available_models.forEach((m,i)=>nameIdx[m.model]=i);
    const raw=(d.split.models||[]).map(m=>{
      const i=nameIdx[m.model]!=null?nameIdx[m.model]:0;
      const c=colorOf(i);
      return {
        name:m.model,type:'line',smooth:true,symbol:'none',
        data:m.output,
        itemStyle:{color:c},lineStyle:{color:c,width:1.8},
        emphasis:{focus:'series'}
      };
    });
    mainChart.setOption({
      backgroundColor:'transparent',
      tooltip:{trigger:'axis',backgroundColor:T().tipBg,borderColor:T().tipBorder,
        textStyle:{color:T().tipText,fontSize:isNarrow()?11:12},confine:true},
      legend:{data:raw.map(x=>x.name),
        textStyle:{color:T().label,fontSize:isNarrow()?11:12},top:0,type:'scroll'},
      grid:{left:isNarrow()?54:78,right:20,top:34,bottom:isNarrow()?22:28},
      xAxis:{type:'category',data:d.split.labels,boundaryGap:false,
        axisLine:{lineStyle:{color:T().axis}},
        axisLabel:{color:T().label,fontSize:isNarrow()?10:12}},
      yAxis:{type:'value',name:isNarrow()?'':'输出 tokens',
        nameLocation:'middle',nameRotate:90,nameGap:56,
        splitLine:{lineStyle:{color:T().split}},
        axisLabel:{color:T().label,fontSize:isNarrow()?10:12,formatter:v=>fmtTok(v)},
        nameTextStyle:{color:T().label}},
      series:raw
    },true);
    return;
  }

  mainChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',backgroundColor:T().tipBg,borderColor:T().tipBorder,
      textStyle:{color:T().tipText,fontSize:isNarrow()?11:12},confine:true},
    legend:{data:['缓存读取','输入','输出'],
      textStyle:{color:T().label,fontSize:isNarrow()?11:12},top:0},
    grid:{left:isNarrow()?50:62,right:isNarrow()?40:56,
      top:isNarrow()?26:30,bottom:isNarrow()?22:28},
    xAxis:{type:'category',data:s.map(x=>x.label),
      axisLine:{lineStyle:{color:T().axis}},
      axisLabel:{color:T().label,fontSize:isNarrow()?10:12}},
    yAxis:[
      {type:'value',name:isNarrow()?'':'tokens',
        splitLine:{lineStyle:{color:T().split}},
        axisLabel:{color:T().label,fontSize:isNarrow()?10:12,formatter:v=>fmtTok(v)},
        nameTextStyle:{color:T().label}},
      {type:'value',name:isNarrow()?'':'tok/s',splitLine:{show:false},
        axisLabel:{color:T().label,fontSize:isNarrow()?10:12},nameTextStyle:{color:T().label}}
    ],
    series:[
      {name:'缓存读取',type:'bar',stack:'t',data:s.map(x=>x.cache_read),
        itemStyle:{color:C.cache},barMaxWidth:26},
      {name:'输入',type:'bar',stack:'t',data:s.map(x=>x.input),
        itemStyle:{color:C.input},barMaxWidth:26},
      {name:'输出',type:'line',yAxisIndex:1,data:s.map(x=>x.output),smooth:true,
        itemStyle:{color:C.output},lineStyle:{color:C.output},symbol:'none'},
    ]
  },true);
}

function renderModels(ms){
  if(!window.echarts)return;
  if(!modelChart){
    modelChart=echarts.init($('modelChart'));
    modelChart.on('click',p=>{
      if(p.seriesType!=='bar')return;   // 只有柱子触发筛选
      const m=p.name;
      if(sel&&sel.length===1&&sel[0]===m)sel=null;   // 再点一次取消
      else sel=[m];                                   // 只看这一个
      if(lastData)renderDd(lastData.available_models);
      load();
    });
  }
  const nameIdx={};
  (lastData?lastData.available_models:[]).forEach((m,i)=>nameIdx[m.model]=i);
  const cyan=cssVar('--mcode-chart-5'),green=cssVar('--mcode-chart-3');
  modelChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',backgroundColor:T().tipBg,borderColor:T().tipBorder,
      textStyle:{color:T().tipText,fontSize:isNarrow()?11:12},confine:true},
    legend:{data:['总输入(含缓存)','调用次数','输出速度'],
      textStyle:{color:T().label,fontSize:isNarrow()?11:12},top:0},
    grid:{left:isNarrow()?50:62,right:isNarrow()?42:56,
      top:34,bottom:isNarrow()?22:28},
    xAxis:{type:'category',data:ms.map(m=>m.model),
      axisLine:{lineStyle:{color:T().axis}},
      axisLabel:{color:T().label,fontSize:isNarrow()?10:12}},
    yAxis:[
      {type:'value',name:isNarrow()?'':'tokens',
        splitLine:{lineStyle:{color:T().split}},
        axisLabel:{color:T().label,fontSize:isNarrow()?10:12,formatter:v=>fmtTok(v)},
        nameTextStyle:{color:T().label}},
      {type:'value',name:isNarrow()?'':'次数 / tok/s',splitLine:{show:false},
        axisLabel:{color:T().label,fontSize:isNarrow()?10:12},
        nameTextStyle:{color:T().label}}
    ],
    series:[
      {name:'总输入(含缓存)',type:'bar',
        data:ms.map(m=>({value:m.cache_read+m.input,
        itemStyle:{color:colorOf(nameIdx[m.model]||0)}})),barMaxWidth:44},
      {name:'调用次数',type:'line',yAxisIndex:1,data:ms.map(m=>m.calls),
        smooth:true,symbol:'circle',symbolSize:6,
        itemStyle:{color:cyan},lineStyle:{color:cyan,width:1.8}},
      {name:'输出速度',type:'line',yAxisIndex:1,data:ms.map(m=>m.tok_s),smooth:true,
        itemStyle:{color:green},lineStyle:{color:green,width:1.8},
        symbol:'circle',symbolSize:7},
    ]
  },true);
}

function renderRecent(rs){
  $('recentBody').innerHTML=rs.length?rs.map(r=>`<tr>
    <td>${r.time}</td>
    <td>${modelTag(r.model)}</td>
    <td title="${r.session_id}" style="max-width:220px;overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap;text-align:left">${r.session||r.session_id.slice(0,12)}</td>
    <td>${fmt(r.input)}</td>
    <td>${fmt(r.output)}</td>
    <td>${fmt(r.cache_read)}</td>
    <td>${(r.dur_ms/1000).toFixed(1)}s</td>
    <td style="color:${r.tok_s>80?'var(--mcode-success)':(r.tok_s>30?'var(--mcode-warning)':'var(--mcode-text-muted)')}">${r.tok_s||'—'}</td>
  </tr>`).join(''):'<tr><td colspan="8" style="text-align:center;color:var(--mcode-text-muted);padding:20px">无数据</td></tr>';
}

function setTimer(){
  if(timer)clearInterval(timer);
  const v=+$('interval').value;
  if(v>0)timer=setInterval(load,v*1000);
}

$('refresh').onclick=load;
$('range').onchange=load;
$('interval').onchange=setTimer;
let rzT=null;
window.addEventListener('resize',()=>{
  mainChart&&mainChart.resize();
  modelChart&&modelChart.resize();
  // 跨过窄屏断点时重算布局（轴名称/边距/字号按 isNarrow() 切换）
  clearTimeout(rzT);
  rzT=setTimeout(()=>{
    if(lastData){renderMain(lastData);renderModels(lastData.models);}
  },200);
});

(function boot(){
  applyTheme();
  if(window.echarts)load();
  else setTimeout(boot,300);
})();
</script>
</body>
</html>

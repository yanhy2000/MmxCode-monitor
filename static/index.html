<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MmxCode-monitor · MiniMax Code 用量监控</title>
<script src="/echarts.min.js"
        onerror="var s=document.createElement('script');s.src='https://registry.npmmirror.com/echarts/5.5.1/files/dist/echarts.min.js';s.onerror=function(){document.getElementById('app').innerHTML='<div class=\'err\'>ECharts 加载失败（本地与 CDN 均不可用）</div>'};document.head.appendChild(s)"></script>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2129;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;
  --orange:#d29922;--purple:#bc8cff;--red:#f85149;--cyan:#39c5cf;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;
  max-width:1280px;margin:0 auto;
  padding:clamp(12px,2vw,20px) clamp(14px,3vw,32px) 48px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:18px;font-weight:600}
h1 .dot{display:inline-block;width:9px;height:9px;border-radius:50%;
  background:var(--green);margin-right:8px;box-shadow:0 0 8px var(--green)}
.sub{color:var(--muted);font-size:12px}
.spacer{flex:1}
select,button{background:var(--surface2);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;font-family:inherit}
select:hover,button:hover{border-color:var(--accent)}
.err{color:var(--red);padding:20px;font-size:15px}

/* --- 多选下拉 --- */
.dd{position:relative}
.ddbtn{display:flex;align-items:center;gap:7px;min-width:150px;justify-content:space-between}
.ddbtn .cnt{color:var(--accent);font-weight:600}
.ddbtn .caret{color:var(--muted);font-size:10px}
.ddpanel{position:absolute;top:calc(100% + 6px);right:0;z-index:50;
  width:min(300px,calc(100vw - 40px));
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px;box-shadow:0 12px 32px rgba(0,0,0,.55);display:none}
.ddpanel.open{display:block}
.ddhead{display:flex;gap:12px;padding:0 4px 8px;border-bottom:1px solid var(--border);
  margin-bottom:6px}
.ddhead a{color:var(--accent);font-size:12px;cursor:pointer;text-decoration:none}
.ddhead a:hover{text-decoration:underline}
.ddlist{max-height:280px;overflow:auto}
.ddrow{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:6px;
  cursor:pointer;font-size:13px}
.ddrow:hover{background:var(--surface2)}
.ddrow input{accent-color:var(--accent);cursor:pointer;width:14px;height:14px}
.ddrow .mname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddrow .mmeta{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.swatch{width:9px;height:9px;border-radius:2px;flex:none}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px}
.kpi .label{color:var(--muted);font-size:12px;margin-bottom:4px}
.kpi .value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .hint{color:var(--muted);font-size:11px;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;margin-bottom:16px}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.panel h2{font-size:14px;font-weight:600;color:var(--text)}
.toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.toggle button{border:0;border-radius:0;background:transparent;padding:3px 10px;font-size:12px}
.toggle button.on{background:var(--accent);color:#0d1117;font-weight:600}
.chart{width:100%}
#mainChart{height:340px}
#modelChart{height:260px}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;
  font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:500;text-align:right;padding:6px 10px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:5px 10px;border-bottom:1px solid #21262d;color:var(--text)}
tr:hover td{background:var(--surface2)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;
  border:1px solid var(--border);white-space:nowrap}
.tablewrap{max-height:420px;overflow:auto}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
#toast{position:fixed;top:14px;right:14px;background:var(--surface2);
  border:1px solid var(--red);color:var(--red);border-radius:8px;padding:8px 14px;
  font-size:13px;display:none;max-width:420px;z-index:99}

/* ---------- 响应式 ---------- */
@media (max-width:720px){
  h1{font-size:16px}
  header{gap:8px}
  .kpis{gap:8px;grid-template-columns:repeat(auto-fit,minmax(125px,1fr))}
  .kpi{padding:10px 12px}
  .kpi .value{font-size:18px}
  .panel{padding:10px 12px;border-radius:8px}
  #mainChart{height:260px}
  #modelChart{height:220px}
  .tablewrap{max-height:360px}
  table{min-width:620px}
  select,button{font-size:12px;padding:4px 8px}
  #toast{left:14px;max-width:none}
}
</style>
</head>
<body>
<div id="app">
<header>
  <h1><span class="dot"></span>MmxCode-monitor</h1>
  <span class="sub" id="dbinfo"></span>
  <div class="spacer"></div>

  <div class="dd" id="modelDd">
    <button class="ddbtn" id="ddBtn">
      <span id="ddLabel">模型: 全部</span>
      <span class="caret">▼</span>
    </button>
    <div class="ddpanel" id="ddPanel">
      <div class="ddhead">
        <a id="ddAll">全选</a><a id="ddInvert">反选</a>
      </div>
      <div class="ddlist" id="ddList"></div>
    </div>
  </div>

  <select id="range">
    <option value="1h">最近 1 小时</option>
    <option value="24h">最近 24 小时</option>
    <option value="7d">最近 7 天</option>
    <option value="30d">最近 30 天</option>
    <option value="all" selected>全部</option>
  </select>
  <select id="interval">
    <option value="0">手动刷新</option>
    <option value="5">自动 5s</option>
    <option value="10" selected>自动 10s</option>
    <option value="30">自动 30s</option>
  </select>
  <button id="refresh">刷新</button>
</header>

<div id="toast"></div>
<div class="kpis" id="kpis"></div>

<div class="panel">
  <div class="phead">
    <h2>Token 消耗时序</h2>
    <span class="sub" id="bucketInfo"></span>
    <div class="spacer"></div>
    <div class="toggle" id="viewToggle">
      <button data-view="agg" class="on">聚合</button>
      <button data-view="split">按模型拆分</button>
    </div>
  </div>
  <div id="mainChart" class="chart"></div>
  <div class="empty" id="mainEmpty" style="display:none">当前筛选条件下没有数据</div>
</div>

<div class="panel">
  <div class="phead"><h2>模型对比</h2>
    <span class="sub">点击柱子可只看该模型，再次点击取消</span></div>
  <div id="modelChart" class="chart"></div>
</div>

<div class="panel">
  <div class="phead"><h2>最近调用</h2><span class="sub" id="recentInfo"></span></div>
  <div class="tablewrap">
  <table>
    <thead><tr>
      <th>时间</th><th>模型</th><th>会话</th>
      <th>输入</th><th>输出</th><th>缓存读取</th>
      <th>耗时</th><th>速度 tok/s</th>
    </tr></thead>
    <tbody id="recentBody"></tbody>
  </table>
  </div>
</div>

<footer id="foot"></footer>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>n==null?'—':n.toLocaleString('zh-CN');
const fmtK=n=>{
  if(n==null)return '—';
  if(n>=1e8)return (n/1e8).toFixed(2)+'亿';
  if(n>=1e4)return (n/1e4).toFixed(1)+'万';
  return n.toLocaleString('zh-CN');
};
const C={input:'#d29922',output:'#3fb950',cache:'#58a6ff'};
const PALETTE=['#58a6ff','#bc8cff','#39c5cf','#3fb950','#d29922','#f85149',
               '#ff7b72','#a5d6ff','#7ee787','#ffa657'];
const colorOf=i=>PALETTE[i%PALETTE.length];
const isNarrow=()=>window.innerWidth<680;

/* 模型筛选状态: null = 全部；不做持久化，每次打开都从全部模型开始 */
let sel=null;

let splitMode=false;
let mainChart=null,modelChart=null,timer=null,lastData=null;

function toast(msg,ok){
  const t=$('toast');
  t.textContent=msg;t.style.borderColor=ok?'var(--green)':'var(--red)';
  t.style.color=ok?'var(--green)':'var(--red)';t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4500);
}

function modelTag(m){
  const cls=m.includes('MiniMax')?'mm':(m.includes('glm')?'glm':'unknown');
  const style=cls==='unknown'?'':'';
  return `<span class="tag ${cls}" style="${style}">${m}</span>`;
}

/* ---------- 多选下拉 ---------- */
function renderDd(avail){
  const list=$('ddList');
  const byName={};
  (avail||[]).forEach((m,i)=>byName[m.model]=i);
  const order=(avail||[]).map(m=>m.model);

  list.innerHTML=(avail||[]).map((m,i)=>`
    <label class="ddrow">
      <input type="checkbox" data-model="${m.model}" ${(!sel||sel.includes(m.model))?'checked':''}>
      <span class="swatch" style="background:${colorOf(i)}"></span>
      <span class="mname">${m.model}</span>
      <span class="mmeta">${fmt(m.calls)} 次 · ${fmtK(m.output)} out</span>
    </label>`).join('') || '<div class="sub" style="padding:8px">当前范围无模型数据</div>';

  list.querySelectorAll('input[data-model]').forEach(cb=>{
    cb.onchange=()=>{
      const all=order.slice();
      const picked=[...list.querySelectorAll('input[data-model]')]
        .filter(x=>x.checked).map(x=>x.dataset.model);
      sel=(picked.length===all.length)?null:(picked.length?picked:[]);
      if(sel&&sel.length===0){ // 全不选 -> 视为全部，避免空图
        sel=null;
        list.querySelectorAll('input[data-model]').forEach(x=>x.checked=true);
      }
      updateDdLabel();load();
    };
  });
  updateDdLabel();
}

function updateDdLabel(){
  const n=sel?sel.length:null;
  if(!sel)$('ddLabel').innerHTML='模型: <span class="cnt">全部</span>';
  else if(n===1)$('ddLabel').innerHTML=`模型: <span class="cnt">${sel[0]}</span>`;
  else $('ddLabel').innerHTML=`已选 <span class="cnt">${n}</span> 个模型`;
}

function ddSet(mode){
  if(!lastData)return;
  const all=lastData.available_models.map(m=>m.model);
  if(mode==='all')sel=null;
  else if(mode==='invert'){
    const cur=sel||all;
    const inv=all.filter(m=>!cur.includes(m));
    sel=inv.length?inv:null;
  }
  renderDd(lastData.available_models);
  load();
}

$('ddBtn').onclick=e=>{e.stopPropagation();$('ddPanel').classList.toggle('open')};
$('ddPanel').onclick=e=>e.stopPropagation();
document.addEventListener('click',()=>$('ddPanel').classList.remove('open'));
$('ddAll').onclick=()=>ddSet('all');
$('ddInvert').onclick=()=>ddSet('invert');

/* ---------- 视图切换 ---------- */
$('viewToggle').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  splitMode=b.dataset.view==='split';
  [...$('viewToggle').children].forEach(x=>x.classList.toggle('on',x===b));
  if(lastData)renderMain(lastData);
};

/* ---------- 数据 ---------- */
function apiUrl(){
  let u='/api/data?range='+$('range').value;
  if(sel&&sel.length)u+='&models='+encodeURIComponent(sel.join(','));
  return u;
}

async function load(){
  try{
    const r=await fetch(apiUrl());
    const d=await r.json();
    if(d.error){toast('读取失败: '+d.error);return}
    lastData=d;
    // 选中项若已不在可用列表，自动收敛
    if(sel){
      const avail=new Set(d.available_models.map(m=>m.model));
      const kept=sel.filter(m=>avail.has(m));
      if(kept.length!==sel.length)sel=kept.length?kept:null;
    }
    render(d);
    const l=d.ledger;
    $('foot').textContent=`快照 ${d.generated_at} · 账本表 ${l?fmt(l.rows)+' 条':''} · 只读快照，不影响运行中的 MiniMax Code`;
  }catch(e){toast('请求失败: '+e.message)}
}

function render(d){
  renderDd(d.available_models);
  const o=d.overview;
  const scope=sel?(sel.length===1?sel[0]:sel.length+' 个模型'):'全部模型';
  $('bucketInfo').textContent=o.calls
    ? `（${scope} · ${fmt(o.calls)} 次调用 · 命中 ${o.hit_rate_pct}% · 加权输出 ${o.avg_tok_s} tok/s）`
    : `（${scope}）`;
  $('recentInfo').textContent=o.calls?`筛选后 ${fmt(o.calls)} 次调用中的最近 ${d.recent.length} 条`:'';

  const cards=[
    ['输入 tokens',fmtK(o.input_tokens),'新计入 prompt 的部分'],
    ['输出 tokens',fmtK(o.output_tokens),`累计生成 ${o.sum_dur_s}s`],
    ['缓存读取',fmtK(o.cache_read_tokens),'服务端命中的缓存'],
    ['缓存命中率',o.hit_rate_pct+'%','cache_read / (cache_read+input)'],
    ['调用次数',fmt(o.calls),scope],
    ['输出速度',o.avg_tok_s+' tok/s','Σoutput / Σduration 加权'],
    ['会话数',fmt(o.sessions),'有用量记录的会话'],
  ];
  $('kpis').innerHTML=cards.map(c=>
    `<div class="kpi"><div class="label">${c[0]}</div>
     <div class="value">${c[1]}</div><div class="hint">${c[2]}</div></div>`).join('');

  renderMain(d);
  renderModels(d.models);
  renderRecent(d.recent);
}

function renderMain(d){
  const empty=!d.overview.calls;
  $('mainEmpty').style.display=empty?'block':'none';
  $('mainChart').style.display=empty?'none':'block';
  if(empty||!window.echarts)return;
  if(!mainChart)mainChart=echarts.init($('mainChart'));
  const s=d.series;

  if(splitMode&&d.split.models.length){
    // 按模型拆分: 每个模型一条输出曲线
    const nameIdx={};
    d.available_models.forEach((m,i)=>nameIdx[m.model]=i);
    const raw=(d.split.models||[]).map(m=>{
      const i=nameIdx[m.model]!=null?nameIdx[m.model]:0;
      return {
        name:m.model,type:'line',smooth:true,symbol:'none',
        data:m.output,
        itemStyle:{color:colorOf(i)},lineStyle:{color:colorOf(i),width:1.8},
        emphasis:{focus:'series'}
      };
    });
    // 只在选中单个模型且该模型无数据时兜底
    mainChart.setOption({
      backgroundColor:'transparent',
      tooltip:{trigger:'axis',backgroundColor:'#1c2129',borderColor:'#30363d',
        textStyle:{color:'#e6edf3',fontSize:isNarrow()?11:12},confine:true},
      legend:{data:raw.map(x=>x.name),
        textStyle:{color:'#8b949e',fontSize:isNarrow()?11:12},top:0,type:'scroll'},
      grid:{left:isNarrow()?54:78,right:20,top:34,bottom:isNarrow()?22:28},
      xAxis:{type:'category',data:d.split.labels,boundaryGap:false,
        axisLine:{lineStyle:{color:'#30363d'}},
        axisLabel:{color:'#8b949e',fontSize:isNarrow()?10:12}},
      yAxis:{type:'value',name:isNarrow()?'':'输出 tokens',
        nameLocation:'middle',nameRotate:90,nameGap:56,
        splitLine:{lineStyle:{color:'#21262d'}},
        axisLabel:{color:'#8b949e',fontSize:isNarrow()?10:12,formatter:v=>fmtK(v)},
        nameTextStyle:{color:'#8b949e'}},
      series:raw
    },true);
    return;
  }

  mainChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',backgroundColor:'#1c2129',borderColor:'#30363d',
      textStyle:{color:'#e6edf3',fontSize:isNarrow()?11:12},confine:true},
    legend:{data:['缓存读取','输入','输出'],
      textStyle:{color:'#8b949e',fontSize:isNarrow()?11:12},top:0},
    grid:{left:isNarrow()?50:62,right:isNarrow()?40:56,
      top:isNarrow()?26:30,bottom:isNarrow()?22:28},
    xAxis:{type:'category',data:s.map(x=>x.label),
      axisLine:{lineStyle:{color:'#30363d'}},
      axisLabel:{color:'#8b949e',fontSize:isNarrow()?10:12}},
    yAxis:[
      {type:'value',name:isNarrow()?'':'tokens',
        splitLine:{lineStyle:{color:'#21262d'}},
        axisLabel:{color:'#8b949e',fontSize:isNarrow()?10:12,formatter:v=>fmtK(v)},
        nameTextStyle:{color:'#8b949e'}},
      {type:'value',name:isNarrow()?'':'tok/s',splitLine:{show:false},
        axisLabel:{color:'#8b949e',fontSize:isNarrow()?10:12},nameTextStyle:{color:'#8b949e'}}
    ],
    series:[
      {name:'缓存读取',type:'bar',stack:'t',data:s.map(x=>x.cache_read),
        itemStyle:{color:C.cache},barMaxWidth:26},
      {name:'输入',type:'bar',stack:'t',data:s.map(x=>x.input),
        itemStyle:{color:C.input},barMaxWidth:26},
      {name:'输出',type:'line',yAxisIndex:1,data:s.map(x=>x.output),
        itemStyle:{color:C.output},lineStyle:{color:C.output},symbol:'none'},
    ]
  },true);
}

function renderModels(ms){
  if(!window.echarts)return;
  if(!modelChart){
    modelChart=echarts.init($('modelChart'));
    modelChart.on('click',p=>{
      if(p.componentType!=='series'||p.seriesName==='输出速度')return;
      const m=p.name;
      if(sel&&sel.length===1&&sel[0]===m)sel=null;   // 再点一次取消
      else sel=[m];                                   // 只看这一个
      if(lastData)renderDd(lastData.available_models);
      load();
    });
  }
  const nameIdx={};
  (lastData?lastData.available_models:[]).forEach((m,i)=>nameIdx[m.model]=i);
  modelChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',backgroundColor:'#1c2129',borderColor:'#30363d',
      textStyle:{color:'#e6edf3',fontSize:isNarrow()?11:12},confine:true},
    legend:{data:['调用次数','总输入(含缓存)','输出速度'],
      textStyle:{color:'#8b949e',fontSize:isNarrow()?11:12},top:0},
    grid:{left:isNarrow()?50:62,right:isNarrow()?42:56,
      top:34,bottom:isNarrow()?22:28},
    xAxis:{type:'category',data:ms.map(m=>m.model),
      axisLine:{lineStyle:{color:'#30363d'}},
      axisLabel:{color:'#8b949e',fontSize:isNarrow()?10:12}},
    yAxis:[
      {type:'value',splitLine:{lineStyle:{color:'#21262d'}},
        axisLabel:{color:'#8b949e',fontSize:isNarrow()?10:12,formatter:v=>fmtK(v)}},
      {type:'value',splitLine:{show:false},
        axisLabel:{color:'#8b949e',fontSize:isNarrow()?10:12}}
    ],
    series:[
      {name:'调用次数',type:'bar',data:ms.map(m=>({value:m.calls,
        itemStyle:{color:colorOf(nameIdx[m.model]||0)}})),barMaxWidth:40},
      {name:'总输入(含缓存)',type:'bar',
        data:ms.map(m=>({value:m.cache_read+m.input,
        itemStyle:{color:colorOf(nameIdx[m.model]||0),opacity:.45}})),barMaxWidth:40},
      {name:'输出速度',type:'line',yAxisIndex:1,data:ms.map(m=>m.tok_s),
        itemStyle:{color:C.output},lineStyle:{color:C.output},
        symbol:'circle',symbolSize:7},
    ]
  },true);
}

function renderRecent(rs){
  $('recentBody').innerHTML=rs.length?rs.map(r=>`<tr>
    <td>${r.time}</td>
    <td>${modelTag(r.model)}</td>
    <td title="${r.session_id}" style="max-width:220px;overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap;text-align:left">${r.session||r.session_id.slice(0,12)}</td>
    <td>${fmt(r.input)}</td>
    <td>${fmt(r.output)}</td>
    <td>${fmt(r.cache_read)}</td>
    <td>${(r.dur_ms/1000).toFixed(1)}s</td>
    <td style="color:${r.tok_s>80?'var(--green)':(r.tok_s>30?'var(--orange)':'var(--muted)')}">${r.tok_s||'—'}</td>
  </tr>`).join(''):'<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:20px">无数据</td></tr>';
}

/* 点击模型对比图的柱子 = 只看该模型 / 取消（处理函数在 renderModels 内绑定） */

function setTimer(){
  if(timer)clearInterval(timer);
  const v=+$('interval').value;
  if(v>0)timer=setInterval(load,v*1000);
}

$('refresh').onclick=load;
$('range').onchange=load;
$('interval').onchange=setTimer;
let rzT=null;
window.addEventListener('resize',()=>{
  mainChart&&mainChart.resize();
  modelChart&&modelChart.resize();
  // 跨过窄屏断点时重算布局（轴名称/边距/字号按 isNarrow() 切换）
  clearTimeout(rzT);
  rzT=setTimeout(()=>{
    if(lastData){renderMain(lastData);renderModels(lastData);}
  },200);
});

(function boot(){
  if(window.echarts)load();
  else setTimeout(boot,300);
})();
</script>
</body>
</html>
